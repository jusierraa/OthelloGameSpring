server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: othello-backend
  
  # Configuración de serialización JSON
  jackson:
    serialization:
      indent-output: true
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# Configuración de logging
logging:
  level:
    root: INFO
    com.othello: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Configuración personalizada del juego
othello:
  tablero:
    tamano: 8
  juego:
    timeout-minutos: 30
